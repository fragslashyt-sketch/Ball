<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ball Doubling</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; color: #e2e8f0; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; font-size: 16px; font-weight: 600; opacity: 0.85; pointer-events: none; }
  #credit { position: fixed; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.5px; color: #e2e8f0; opacity: 0.85; text-shadow: 0 1px 6px rgba(0,0,0,0.6); pointer-events: none; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(11,16,32,0.92); font-size: 18px; cursor: pointer; z-index: 5; }
  #start.hidden { display: none; }
  #start span { border: 1px solid #475569; border-radius: 999px; padding: 12px 24px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Balls: <span id="count">0</span></div>
<div id="credit">Made by <span style="color:#f472b6">FragSlash</span></div>
<div id="start"><span>Tap to start (enables sound)</span></div>
<script>
  // One ball drops from the center. Each wall bounce doubles the balls.
  // Bounces keep a constant speed that carries the ball up to the top of the circle.
  // The circle shrinks slightly on every bounce. When the balls are packed tightly,
  // the circle explodes and the balls fly out in every direction.
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const countEl = document.getElementById('count');
  const startEl = document.getElementById('start');

  const STEP = 1 / 120;          // fixed physics step
  const COOLDOWN = 0.3;          // seconds before a ball can split again
  const SHRINK_PER_BOUNCE = 0.999;
  const PACK_RATIO = 0.6;        // explode when ball area is this fraction of circle area
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
  const PALETTE = Array.from({ length: 12 }, (_, i) => `hsl(${i * 30}, 85%, 58%)`);
  const buckets = PALETTE.map(() => []);

  let dpr, W, H, cx, cy, base, BR, shrink = 1, R;
  let balls = [], rings = [], hits = 0, started = false, phase = 'run';
  let boomTime = 0, acc = 0, last = performance.now();

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx = W / 2; cy = H / 2;
    base = Math.min(W, H) * 0.42;
    BR = Math.min(W, H) * 0.02;   // ball size stays constant on screen
    R = base * shrink;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Sound ----------
  let actx = null, master = null, lastSound = 0, noiseBuf = null;
  function ensureAudio() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value = 0.5;
      master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 1.2, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    }
    if (actx.state === 'suspended') actx.resume();
  }
  function tone(freq, dur, vol, type) {
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  // Each bounce plays the next note up the scale, so every hit has its own pitch
  function playHit(n) {
    if (!actx) return;
    const now = performance.now();
    if (now - lastSound < 40) return;
    lastSound = now;
    const oct = Math.min(2, Math.floor(n / SCALE.length));
    const freq = 220 * Math.pow(2, (SCALE[n % SCALE.length] + 12 * oct) / 12);
    tone(freq, 0.5, 0.25, 'sine');
    tone(freq * 2, 0.25, 0.06, 'triangle');
  }
  function boomSound() {
    if (!actx) return;
    const src = actx.createBufferSource(), g = actx.createGain();
    src.buffer = noiseBuf; g.gain.value = 0.8;
    src.connect(g).connect(master); src.start();
    tone(160, 0.9, 0.5, 'sine');
  }

  // ---------- Physics ----------
  function hitWall() {
    hits++;
    shrink *= SHRINK_PER_BOUNCE;
    playHit(hits);
    rings.push({ x: 0, y: 0, r: 4, a: 1 });
    if (rings.length > 60) rings.shift();
  }

  function stepRun(h) {
    const g = 2.6 * R;
    const S = Math.sqrt(4 * g * R);   // speed that carries a bounce up to the top of the circle
    const limit = R - BR;
    const children = [];
    for (const b of balls) {
      b.vy += g * h;
      b.x += b.vx * h;
      b.y += b.vy * h;
      b.cool -= h;

      const dx = b.x - cx, dy = b.y - cy;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      if (d <= limit) continue;

      const nx = dx / d, ny = dy / d;
      b.x = cx + nx * limit; b.y = cy + ny * limit;
      const vn = b.vx * nx + b.vy * ny;
      if (vn <= 0) continue;

      // Reflect, then keep the speed constant
      b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny;
      const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || 1;
      b.vx *= S / sp; b.vy *= S / sp;

      if (b.cool <= 0 && vn > 20) {
        b.cool = COOLDOWN;
        hitWall();
        rings[rings.length - 1].x = cx + nx * R;
        rings[rings.length - 1].y = cy + ny * R;
        const ang = (Math.random() < 0.5 ? -1 : 1) * 0.35;
        const cs = Math.cos(ang), sn = Math.sin(ang);
        children.push({ x: b.x, y: b.y, vx: b.vx * cs - b.vy * sn, vy: b.vx * sn + b.vy * cs,
                        c: (b.c + 1) % PALETTE.length, cool: COOLDOWN });
      }
    }
    for (const c of children) balls.push(c);

    // Explode once the circle has shrunk down to about the size of the balls
    if (R <= BR * 1.2) startBoom();
  }

  function startBoom() {
    phase = 'boom';
    boomTime = 0;
    boomSound();
    const k = Math.min(W, H) / 400;
    for (const b of balls) {
      const a = Math.random() * Math.PI * 2;
      const sp = (250 + Math.random() * 450) * k;
      b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
    }
  }

  function stepBoom(h) {
    boomTime += h;
    for (const b of balls) {
      b.x += b.vx * h; b.y += b.vy * h;
      if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx); }
      if (b.x > W - BR) { b.x = W - BR; b.vx = -Math.abs(b.vx); }
      if (b.y < BR) { b.y = BR; b.vy = Math.abs(b.vy); }
      if (b.y > H - BR) { b.y = H - BR; b.vy = -Math.abs(b.vy); }
    }
  }

  function step(h) {
    if (phase === 'run') stepRun(h);
    else stepBoom(h);
    for (const rg of rings) { rg.r += h * 300; rg.a -= h * 2.2; }
    while (rings.length && rings[0].a <= 0) rings.shift();
    R = base * shrink;
  }

  // ---------- Drawing ----------
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0b1020';
    ctx.fillRect(0, 0, W, H);

    const circleAlpha = phase === 'run' ? 1 : Math.max(0, 1 - boomTime * 2);
    if (circleAlpha > 0) {
      ctx.globalAlpha = circleAlpha;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#334155';
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    if (phase === 'run') {
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      for (const rg of rings) {
        ctx.globalAlpha = Math.max(0, rg.a) * 0.6;
        ctx.beginPath();
        ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    for (const bk of buckets) bk.length = 0;
    for (const b of balls) buckets[b.c].push(b);
    for (let c = 0; c < buckets.length; c++) {
      const list = buckets[c];
      if (!list.length) continue;
      ctx.beginPath();
      for (const b of list) {
        ctx.moveTo(b.x + BR, b.y);
        ctx.arc(b.x, b.y, BR, 0, Math.PI * 2);
      }
      ctx.fillStyle = PALETTE[c];
      ctx.fill();
    }
  }

  // ---------- Start (one tap only to unlock sound) ----------
  startEl.addEventListener('click', () => {
    ensureAudio();
    started = true;
    // Single ball at the center, moving down fast enough to reach the top after its first bounce
    const g = 2.6 * R;
    balls.push({ x: cx, y: cy, vx: 0, vy: Math.sqrt(2 * g * R), c: 0, cool: 0 });
    startEl.classList.add('hidden');
  });

  // ---------- Loop ----------
  let hudTimer = 0;
  function loop(now) {
    const frame = Math.min((now - last) / 1000, 0.25);
    last = now;
    if (started) {
      acc += frame;
      let n = 0;
      while (acc >= STEP && n < 32) { step(STEP); acc -= STEP; n++; }
      if (n === 32) acc = 0;
    }
    draw();
    hudTimer += frame;
    if (hudTimer > 0.25) { countEl.textContent = balls.length; hudTimer = 0; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
